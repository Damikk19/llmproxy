stages:
  - test
  - image

test-job:
  stage: test
  image: alpine:3.21.8
  dependencies: []
  script:
    # Same base image and aiohttp/yarl pins as the Dockerfile.
    - apk add py3-aiosqlite py3-pip py3-prometheus-client
    - pip install --break-system-packages aiohttp==3.14.3 yarl==1.25.1
    - python3 -m unittest

image-job:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
  rules:
    - if: $CI_COMMIT_TAG
